[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sentinel-ai"
version = "0.1.0"
description = "Safety-first agentic AI layer for defensive cybersecurity investigation"
requires-python = ">=3.12"
license = {text = "PROPRIETARY"}
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<2.10",
    "pydantic-settings>=2.6,<2.7",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.14,<1.15",
    "pgvector>=0.3,<0.4",
    "langgraph>=0.2,<0.3",
    "langgraph-checkpoint-postgres>=2.0,<3.0",
    "mistralai>=1.2,<2.0",
    "httpx>=0.27,<0.28",
    "structlog>=24.4,<25.0",
    "opentelemetry-api>=1.28,<2.0",
    "opentelemetry-sdk>=1.28,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.49b,<1.0",
    "pyjwt[crypto]>=2.9,<3.0",
    "pyyaml>=6.0,<7.0",
    "sse-starlette>=2.1,<3.0",
    "uuid6>=2024.7,<2025.0",
    "cryptography>=43.0,<44.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<1.14",
    "pytest>=8.3,<8.4",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=6.0,<6.1",
    "hypothesis>=6.115,<6.116",
    "respx>=0.21,<0.22",
    "import-linter>=2.1,<2.2",
    "types-pyyaml>=6.0,<7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/sentinel_config", "packages/contracts", "packages/policy",
            "packages/gateway", "packages/agent", "packages/llm",
            "packages/decision", "packages/tools", "packages/redaction",
            "packages/audit", "packages/api", "packages/evidence"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "DTZ",
    "T10", "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF",
    "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLW", "TRY", "FLY", "PERF", "RUF",
]
ignore = [
    "S101",   # assert allowed in tests
    "TRY003", # long exception messages OK for problem+json
    "ARG001", # unused function args OK for interface compliance
    "E501",   # line length handled by ruff format
    "ISC001", # formatter conflict
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ARG001", "PLR2004"]
"scripts/**" = ["T201"]
"packages/api/routes.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = [
    "sentinel_config", "contracts", "policy", "gateway", "agent",
    "llm", "decision", "tools", "redaction", "audit", "api", "evidence",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: unit tests (no IO)",
    "integration: tests that need Postgres",
    "security: security-critical tests",
    "property: Hypothesis property tests",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["packages"]
branch = true

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "assert_never",
]
